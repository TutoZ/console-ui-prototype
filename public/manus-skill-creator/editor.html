<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    height: 100%;
    background: var(--background-gray-main, #f8f8f7);
    color: var(--text-primary, #34322d);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  #root { height: 100%; display: flex; }
  /* 左侧资源管理器 — 色/字号对齐 Manus，结构为技能包文件树 */
  .explorer {
    width: 232px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--background-gray-main, #f8f8f7);
    border-right: 1px solid var(--border-main, #0000000f);
  }
  .explorer-head {
    height: 40px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-main, #0000000f);
    font-size: 12px;
    color: var(--text-tertiary, #858481);
    font-weight: 500;
  }
  .explorer-body { flex: 1; overflow: auto; padding: 8px 6px; }
  .tree-pkg {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; font-size: 12px; font-weight: 500;
    color: var(--text-primary, #34322d);
  }
  .tree-pkg .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .tree-folder, .tree-file {
    width: 100%;
    display: flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 8px; border: 0; background: transparent;
    border-radius: 6px; cursor: pointer;
    color: var(--text-primary, #34322d);
    font-size: 12px;
    text-align: left;
  }
  .tree-folder:hover, .tree-file:hover { background: var(--fill-tsp-white-light, #37352f0a); }
  .tree-file.active { background: var(--tab-fill, #0000000a); }
  .tree-file .mono, .tree-folder .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
  }
  .indent-1 { padding-left: 16px; }
  .indent-2 { padding-left: 28px; }
  .chev { width: 12px; height: 12px; color: var(--text-tertiary, #858481); transition: transform .15s; flex-shrink: 0; }
  .chev.open { transform: rotate(90deg); }
  .icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-tertiary, #858481); }
  .dot-dirty { margin-left: auto; width: 6px; height: 6px; border-radius: 99px; background: #d97706; }

  /* 右侧编辑器 — 1:1 Manus agent-workspace 顶栏字号/色 */
  #manus-agent-workspace {
    flex: 1; min-width: 0; height: 100%;
    display: flex; flex-direction: column;
    background: var(--background-gray-main, #f8f8f7);
  }
  .ed-head {
    display: flex; height: 56px; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border-main, #0000000f);
    padding: 12px 16px; flex-shrink: 0;
  }
  .ed-head h2 {
    margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 16px; font-weight: 500;
    color: var(--text-primary, #34322d);
  }
  .ed-sub {
    display: flex; min-width: 0; align-items: center; gap: 8px;
    color: var(--text-tertiary, #858481); font-size: 12px; /* text-xs */
  }
  .ed-sub .sep { height: 12px; width: 1px; flex-shrink: 0; background: var(--border-main, #0000000f); }
  .ed-sub .path {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ed-sub .path .mono {
    margin-inline-start: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .ed-actions { display: flex; flex-shrink: 0; align-items: center; gap: 4px; }
  .ed-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 28px; padding: 0 10px; border: 0; border-radius: 6px;
    background: transparent; cursor: pointer;
    color: var(--text-tertiary, #858481); font-size: 12px;
  }
  .ed-btn:hover { background: var(--fill-tsp-white-light, #37352f0a); color: var(--text-primary, #34322d); }

  .view-tabs {
    display: flex; align-items: center; justify-content: center;
    padding: 8px 16px; flex-shrink: 0;
  }
  .view-tabs-inner {
    display: inline-flex; height: 28px; align-items: center;
    border-radius: 8px; background: var(--tab-fill, #0000000a); padding: 2px;
  }
  .view-tab {
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent; cursor: pointer;
    border-radius: 6px; padding: 4px 12px; font-size: 12px;
    color: var(--text-tertiary, #858481); transition: color .15s, background .15s;
  }
  .view-tab[data-state="on"] {
    background: var(--fill-white, #fff);
    color: var(--text-primary, #34322d);
    box-shadow: 0 0 2px 0 var(--shadow-S, rgba(0,0,0,.08));
  }

  .ed-body { flex: 1; min-height: 0; overflow: auto; background: #fff; }
  .ed-scroll-inner { display: flex; min-height: 100%; align-items: stretch; }
  .gutter {
    width: 48px; flex-shrink: 0;
    background: #f8f8f8; border-right: 1px solid var(--border-main, #0000000f);
    padding: 12px 8px 12px 0; text-align: right;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px; line-height: 20px;
    color: var(--text-tertiary, #858481); user-select: none;
  }
  .code {
    flex: 1; min-width: 0; border: 0; outline: none; resize: none;
    padding: 12px 16px; margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px; line-height: 20px;
    color: var(--text-primary, #34322d);
    background: #fff; white-space: pre; overflow: hidden;
  }
  .code[readonly] { color: #4a4843; }
  .ed-foot {
    height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; border-top: 1px solid var(--border-main, #0000000f);
    background: var(--background-gray-main, #f8f8f7);
    font-size: 11px; color: var(--text-tertiary, #858481);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
</style>
</head>
<body>
<div id="root">
  <aside class="explorer">
    <div class="explorer-head">
      <span>资源管理器</span>
      <span id="pkg-name" class="mono" style="font-family:ui-monospace,Menlo,monospace;max-width:110px;overflow:hidden;text-overflow:ellipsis"></span>
    </div>
    <div class="explorer-body" id="tree"></div>
  </aside>
  <section id="manus-agent-workspace">
    <div class="ed-head">
      <div style="display:flex;min-width:0;flex:1;flex-direction:column;justify-content:center">
        <h2>编辑器</h2>
        <div class="ed-sub">
          <div id="status-label">正在编辑</div>
          <div class="sep"></div>
          <div class="path" id="file-path">—</div>
        </div>
      </div>
      <div class="ed-actions">
        <button type="button" class="ed-btn" id="btn-copy">复制</button>
      </div>
    </div>
    <div class="view-tabs" id="view-tabs" hidden>
      <div class="view-tabs-inner">
        <button type="button" class="view-tab" data-view="original" data-state="off">原始</button>
        <button type="button" class="view-tab" data-view="modified" data-state="on">已修改</button>
      </div>
    </div>
    <div class="ed-body" id="scroll-wrap">
      <div class="ed-scroll-inner">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea class="code" id="code" spellcheck="false"></textarea>
      </div>
    </div>
    <div class="ed-foot">
      <div><span id="foot-path"></span> · UTF-8 · <span id="foot-lines">0</span> lines</div>
      <div id="foot-mode">Markdown</div>
    </div>
  </section>
</div>
<script>
(function () {
  const state = {
    packageName: 'my_skill',
    activeId: 'skill.md',
    view: 'modified', // original | modified
    files: {
      'skill.md': { id: 'skill.md', name: 'SKILL.md', path: 'SKILL.md', editable: true, content: '', original: '' },
      'handler.ts': { id: 'handler.ts', name: 'handler.ts', path: 'scripts/handler.ts', editable: false, content: '', original: '' },
      'schema.json': { id: 'schema.json', name: 'schema.json', path: 'references/schema.json', editable: false, content: '', original: '' },
      'metadata.yaml': { id: 'metadata.yaml', name: 'metadata.yaml', path: 'metadata.yaml', editable: false, content: '', original: '' },
    },
    folders: { scripts: true, references: true },
  };

  const $ = (id) => document.getElementById(id);
  const code = $('code');
  const gutter = $('gutter');
  const tree = $('tree');

  function activeFile() { return state.files[state.activeId]; }

  function currentText() {
    const f = activeFile();
    if (!f) return '';
    if (f.editable && state.view === 'original') return f.original || f.content;
    return f.content;
  }

  function lineCount(text) {
    if (!text) return 1;
    return text.split('\n').length;
  }

  function renderGutter(n) {
    let html = '';
    for (let i = 1; i <= n; i++) html += '<div>' + i + '</div>';
    gutter.innerHTML = html;
  }

  function syncEditor() {
    const f = activeFile();
    if (!f) return;
    const text = currentText();
    const canEdit = f.editable && state.view === 'modified';
    const keepCursor = document.activeElement === code && code.value === text;
    if (!keepCursor) {
      const start = code.selectionStart;
      const end = code.selectionEnd;
      code.value = text;
      if (document.activeElement === code) {
        try { code.setSelectionRange(start, end); } catch (e) {}
      }
    }
    code.readOnly = !canEdit;
    const n = lineCount(text);
    renderGutter(Math.max(n, 1));
    code.style.height = Math.max(n, 28) * 20 + 'px';
    $('status-label').textContent = canEdit ? '正在编辑' : '正在查看';
    $('file-path').innerHTML = '<span class="mono">' + f.path + '</span>';
    $('foot-path').textContent = f.path;
    $('foot-lines').textContent = String(n);
    $('foot-mode').textContent = canEdit ? '可编辑' : '只读';
    $('pkg-name').textContent = state.packageName;
    $('view-tabs').hidden = !f.editable;
    document.querySelectorAll('.view-tab').forEach((btn) => {
      btn.dataset.state = btn.dataset.view === state.view ? 'on' : 'off';
    });
    renderTree();
  }

  function renderTree() {
    const dirty = state.files['skill.md'].content !== state.files['skill.md'].original;
    const fileBtn = (id, indent) => {
      const f = state.files[id];
      const active = state.activeId === id;
      return '<button type="button" class="tree-file ' + indent + (active ? ' active' : '') + '" data-id="' + id + '">' +
        '<svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h6.5L13 6v7.5H3v-11z" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 2.5V6H13" stroke="currentColor" stroke-width="1.2"/></svg>' +
        '<span class="mono">' + f.name + '</span>' +
        (id === 'skill.md' && dirty ? '<span class="dot-dirty"></span>' : '') +
        '</button>';
    };
    const folder = (key, label) => {
      const open = state.folders[key];
      return '<button type="button" class="tree-folder indent-1" data-folder="' + key + '">' +
        '<svg class="chev' + (open ? ' open' : '') + '" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>' +
        '<svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M2 4.5h4l1.2 1.5H14v7H2v-8.5z" stroke="currentColor" stroke-width="1.2"/></svg>' +
        '<span class="mono">' + label + '</span></button>';
    };
    tree.innerHTML =
      '<div class="tree-pkg"><svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M2 4.5h4l1.2 1.5H14v7H2v-8.5z" stroke="currentColor" stroke-width="1.2"/></svg><span class="mono">' + state.packageName + '</span></div>' +
      fileBtn('skill.md', 'indent-1') +
      folder('scripts', 'scripts') +
      (state.folders.scripts ? fileBtn('handler.ts', 'indent-2') : '') +
      folder('references', 'references') +
      (state.folders.references ? fileBtn('schema.json', 'indent-2') : '') +
      fileBtn('metadata.yaml', 'indent-1');
  }

  tree.addEventListener('click', (e) => {
    const folder = e.target.closest('[data-folder]');
    if (folder) {
      const k = folder.getAttribute('data-folder');
      state.folders[k] = !state.folders[k];
      renderTree();
      return;
    }
    const btn = e.target.closest('[data-id]');
    if (!btn) return;
    state.activeId = btn.getAttribute('data-id');
    if (state.activeId === 'skill.md') state.view = 'modified';
    syncEditor();
  });

  document.querySelectorAll('.view-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      syncEditor();
    });
  });

  code.addEventListener('input', () => {
    const f = activeFile();
    if (!f || !f.editable || state.view !== 'modified') return;
    f.content = code.value;
    const n = lineCount(f.content);
    renderGutter(Math.max(n, 1));
    code.style.height = Math.max(n, 28) * 20 + 'px';
    $('foot-lines').textContent = String(n);
    renderTree();
    parent.postMessage({ type: 'manus-expert-change', id: f.id, content: f.content }, '*');
  });

  $('btn-copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(currentText());
      parent.postMessage({ type: 'manus-expert-toast', message: '已复制 ' + activeFile().name }, '*');
    } catch (e) {}
  });

  // sync scroll gutter with textarea via shared parent — textarea grows, wrap scrolls
  $('scroll-wrap').addEventListener('scroll', () => {}, { passive: true });

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'manus-expert-init' || data.type === 'manus-expert-sync') {
      if (data.packageName) state.packageName = data.packageName;
      if (Array.isArray(data.files)) {
        data.files.forEach((f) => {
          if (!state.files[f.id]) return;
          state.files[f.id].content = f.content || '';
          if (typeof f.original === 'string') state.files[f.id].original = f.original;
          else if (data.type === 'manus-expert-init') state.files[f.id].original = f.content || '';
          if (typeof f.editable === 'boolean') state.files[f.id].editable = f.editable;
          if (f.path) state.files[f.id].path = f.path;
          if (f.name) state.files[f.id].name = f.name;
        });
      }
      if (data.activeId && state.files[data.activeId]) state.activeId = data.activeId;
      syncEditor();
      if (data.type === 'manus-expert-init') {
        parent.postMessage({ type: 'manus-expert-ready' }, '*');
      }
    }
  });

  // ready handshake
  parent.postMessage({ type: 'manus-expert-ready' }, '*');
  syncEditor();
})();
</script>
</body>
</html>
